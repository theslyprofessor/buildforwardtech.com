    <text x="178" y="24" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">QuietPlease</text>
    <text x="178" y="42" fill="#6ee7b7" font-family="ui-monospace, monospace" font-size="10">SLOT #2 · x=1742</text>

    <rect x="328" y="0" width="152" height="54" rx="10" fill="#451a03" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5"/>
