  <text x="44" y="44" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">&#63743;  BarStage   File   Edit   View</text>

  <!-- Camera Notch -->
  <rect x="390" y="20" width="160" height="30" rx="10" fill="#000000" stroke="#1e293b" stroke-width="1"/>
  <circle cx="470" cy="35" r="5" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="415" y="68" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="11" font-weight="700">NOTCH-HIDDEN ZONE (x &lt; 575)</text>

  <!-- Rightmost Pinned Menu Bar Slots -->
  <rect x="580" y="26" width="248" height="26" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
  <text x="592" y="43" fill="#6ee7b7" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700">#4 MIDI  #3 Tidy  #2 Quiet  #1 Displays</text>
  <rect x="836" y="26" width="88" height="26" rx="6" fill="#0284c7"/>
  <text x="848" y="43" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">BarStage</text>

  <!-- Popover Window -->
