  <text x="254" y="533" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="10" font-weight="700">SPONSORED · FREE FOREVER WITH ADS</text>
  <text x="254" y="549" fill="#cbd5e1" font-family="system-ui, -apple-system, sans-serif" font-size="11">ScreenStage v1.1: Every room remembers every monitor.</text>
  <rect x="576" y="523" width="132" height="28" rx="6" fill="#10b981"/>
  <text x="588" y="541" fill="#020617" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800">Remove Ads ($9)</text>
</svg>
