  <text x="268" y="170" fill="#020617" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800">Apply Order to macOS Menu Bar (Cmd-Drag)</text>
  <rect x="560" y="150" width="160" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="595" y="170" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700">35 Total · 2 Hidden</text>

