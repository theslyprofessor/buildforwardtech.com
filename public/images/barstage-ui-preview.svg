  <g transform="translate(240, 372)">
    <rect x="0" y="0" width="480" height="36" rx="8" fill="#1e293b"/>
    <text x="14" y="23" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">#1</text>
    <text x="48" y="23" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">ScreenStage (Displays)</text>
    <text x="360" y="23" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">[Open] [Up] [Down] [#1]</text>

    <rect x="0" y="44" width="480" height="36" rx="8" fill="#1e293b"/>
    <text x="14" y="67" fill="#34d399" font-family="ui-monospace, monospace" font-size="12" font-weight="700">#2</text>
    <text x="48" y="67" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">QuietPlease (Room SPL Monitor)</text>
    <text x="360" y="67" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">[Open] [Up] [Down] [#1]</text>

    <rect x="0" y="88" width="480" height="36" rx="8" fill="#1e293b"/>
    <text x="14" y="111" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="12" font-weight="700">#3</text>
    <text x="48" y="111" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Tidy / Hammerspoon (Rescued from Notch)</text>
    <text x="360" y="111" fill="#38bdf8" font-family="ui-monospace, monospace" font-size="11">[Open] [Up] [Down] [#1]</text>
