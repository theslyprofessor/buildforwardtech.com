    <text x="342" y="42" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10">NOTCH RESCUED</text>

    <rect x="0" y="64" width="152" height="54" rx="10" fill="#451a03" fill-opacity="0.6" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="14" y="88" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">MIDI Bridge</text>
    <text x="14" y="106" fill="#fbbf24" font-family="ui-monospace, monospace" font-size="10">NOTCH RESCUED</text>

    <rect x="164" y="64" width="152" height="54" rx="10" fill="#0c4a6e" fill-opacity="0.45" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="178" y="88" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Loops</text>
    <text x="178" y="106" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10">SLOT #5 · PINNED</text>

    <rect x="328" y="64" width="152" height="54" rx="10" fill="#0c4a6e" fill-opacity="0.45" stroke="#38bdf8" stroke-width="1.5"/>
    <text x="342" y="88" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Blackbox</text>
    <text x="342" y="106" fill="#7dd3fc" font-family="ui-monospace, monospace" font-size="10">SLOT #6 · PINNED</text>
  </g>

  <!-- Exact Menu Bar Slot Order List -->
