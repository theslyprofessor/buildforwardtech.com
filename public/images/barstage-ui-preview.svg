  <text x="290" y="118" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="800">BarStage</text>
  <rect x="372" y="104" width="112" height="18" rx="5" fill="#064e3b"/>
  <text x="380" y="117" fill="#34d399" font-family="ui-monospace, monospace" font-size="10" font-weight="700">FREE FOREVER</text>
